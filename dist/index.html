<script>
const VOCAB = [
['ambivalence','noun','Mixed or conflicting feelings about the same thing.','Her ambivalence about the proposal came from loving its goal but doubting its cost.','Conflicting feelings, not simply indifference.'],
['avail','verb / noun','To help or benefit; as a noun, use or benefit.','Their repeated appeals were to no avail; the council refused to reconsider.','“To no avail” means without success. The review prints “avail?”; this guide includes avail.'],
['circumspect','adjective','Careful to consider possible consequences before acting.','The circumspect editor checked every claim before publishing the report.','Cautious and thoughtful.'],
['dissuade','verb','To persuade someone not to do something.','The evidence dissuaded him from repeating the rumor.','Dissuade someone from an action.'],
['dogmatic','adjective','Insisting on beliefs as unquestionably true, without considering alternatives.','The dogmatic speaker dismissed every objection without examining it.','A certainty of attitude, not proof of accuracy.'],
['epitome','noun','A person or thing that is a perfect example of a quality or type.','Her carefully sourced essay was the epitome of thorough research.','The epitome of something.'],
['evaluate','verb','To judge the value, quality, or effectiveness of something using criteria.','We evaluated the policy by comparing its costs with its results.','Evaluation judges; analysis explains how parts function.'],
['exhort','verb','To urge or encourage strongly.','The captain exhorted the team to keep practicing.','More forceful than casually suggesting.'],
['explicate','verb','To explain or interpret something in detail.','The student explicated the metaphor by tracing its connection to the speaker’s fear.','Make the meaning clear through careful explanation.'],
['explicit','adjective','Clearly and directly stated.','The instructions were explicit: include evidence in every paragraph.','Stated openly; compare implicit.'],
['fallacy','noun','An error in reasoning that weakens an argument.','Treating two unrelated events as cause and effect is a fallacy.','A reasoning problem, not merely a fact you dislike.'],
['gist','noun','The central point or general meaning.','The gist of the editorial is that the library needs longer hours.','Main idea rather than every detail.'],
['impeccable','adjective','Faultless; meeting a very high standard.','Her impeccable citations made each source easy to locate.','Without faults in the quality being described.'],
['implicit','adjective','Suggested or understood without being directly stated.','The empty chair carried an implicit reminder of the missing student.','Suggested; compare explicit.'],
['imply','verb','To suggest something without stating it directly.','The writer’s repeated references to wasted money imply distrust of the project.','The writer or evidence implies.'],
['indisputable','adjective','Not reasonably open to doubt or disagreement.','The timestamp provided indisputable evidence that the message arrived late.','Use only when the evidence warrants such certainty.'],
['inexplicable','adjective','Unable to be explained or accounted for.','Without the missing data, the sudden change seemed inexplicable.','Unexplainable, not merely unexplained so far.'],
['infer','verb','To reach a conclusion from evidence and reasoning.','From the hesitant replies, readers can infer that the narrator feels uncertain.','The reader infers; the writer implies.'],
['introspective','adjective','Examining one’s own thoughts and feelings.','In an introspective journal entry, she questioned her motives.','Looking inward.'],
['parlance','noun','A way of speaking or vocabulary used by a particular group.','In legal parlance, the statement is called an affidavit.','Often used as “in the parlance of.”'],
['perspicuous','adjective','Clearly expressed and easy to understand.','The perspicuous explanation helped everyone follow the complex argument.','Clear expression; do not confuse with perceptive or perspicacious.'],
['plausible','adjective','Seeming reasonable or believable.','Her explanation was plausible, but we still needed evidence.','Believable does not mean proven.'],
['polemic','noun','A forceful written or spoken attack on a belief, policy, or position.','The essay was a polemic against censorship.','A strong argumentative attack.'],
['ponder','verb','To think about something carefully and deeply.','He paused to ponder the implications of the new evidence.','Consider thoughtfully.'],
['prevail','verb','To succeed, win, or remain dominant.','The stronger argument prevailed after the evidence was examined.','Can also mean to be widespread, as in “customs that prevail.”'],
['red herring','noun','An irrelevant issue introduced to distract from the issue being discussed.','Bringing up the uniforms during a debate about library funding was a red herring.','A diversion from the central question.'],
['refute','verb','To disprove a claim with evidence or reasoning.','The attendance records refuted the claim that no students used the library.','Denial alone is not refutation.'],
['specious','adjective','Appearing sound or true while actually being misleading or faulty.','The specious argument used a striking statistic from an unrelated population.','Deceptively plausible.'],
['spectrum','noun','A range of different positions, qualities, or possibilities.','The survey revealed a spectrum of views, from strong support to strong opposition.','A range, not just two opposing choices.'],
['stratagem','noun','A plan or maneuver designed to gain an advantage, sometimes through deception.','The debater’s stratagem was to redirect attention to an easier question.','A calculated maneuver.'],
['sublime','adjective','Inspiring awe through exceptional beauty, grandeur, or excellence.','The sublime mountain view left the hikers silent.','More elevated than simply pleasant.'],
['substantiate','verb','To support a claim with evidence.','She used dated records to substantiate her account of the event.','Show support rather than merely repeat the assertion.'],
['vociferous','adjective','Loud and forceful in expressing feelings or opinions.','The proposal met vociferous opposition at the meeting.','Describes forceful expression, not necessarily good reasoning.'],
['vulgar','adjective','Coarse, crude, or lacking refinement; sometimes meaning common or ordinary.','The vulgar insult weakened the speaker’s credibility.','Context determines the sense; it need not refer to profanity.']
].map((v,i)=>({id:'v'+i,word:v[0],pos:v[1],def:v[2],example:v[3],tip:v[4]}));
const MODULES = [
{id:'rhetoric',title:'The rhetorical situation',eyebrow:'01 / Foundations',summary:'Identify who is speaking, to whom, and why this moment matters.',items:[
['Rhetorical analysis','Explain how a writer’s choices work on a particular audience to advance a purpose. Connect a choice to evidence, an audience effect, and the purpose.','Analysis: “By describing the fee as a barrier, the writer frames it as exclusion and asks the board to remove it.” Evaluation: “The essay is excellent.”','Do not replace explanation with praise or plot summary.'],
['Ethos, logos, and pathos','Ethos concerns credibility and character. Logos uses reasons, evidence, and logical connections. Pathos appeals to an audience’s emotions or values. A passage can combine all three.','A nurse cites her experience (ethos), compares patient counts (logos), and describes a frightened child (pathos).','Numbers can be misleading; an appeal is a method, not a guarantee of truth.'],
['The rhetorical triangle','Study the relationship among speaker, audience, and message or subject within a context. Ask what the audience knows, values, doubts, and needs from this speaker.','A student addresses a school board about library hours; the argument must address the board’s budget concerns.','Purpose and context shape all three corners.'],
['SOAPSTone','Speaker: whose voice? Occasion: what time, setting, and circumstances? Audience: who is addressed? Purpose: what response is sought? Subject: what is discussed? Tone: what attitude is conveyed?','For an appeal to preserve a park: a resident speaks during a rezoning debate to council members, seeking protection of shared space.','Speaker is not automatically identical to the author in every kind of text.'],
['Purpose and exigence','Purpose is what the writer seeks to accomplish. Exigence is the problem, need, or event that calls forth a response. Occasion includes the broader circumstances of the communication.','Exigence: a proposed library closure. Purpose: persuade the council to keep it open.','“The library” is a subject; “secure funding for the library” is a purpose.'],
['Close reading and annotation','Read once for the main claim and situation. Reread for choices, patterns, shifts, and tensions. Annotate a precise detail and explain why it matters. Test interpretations against the whole passage.','Mark “our library,” then note: shared ownership invites the council to identify with residents.','Highlighting without explanatory notes is only a starting point.']
]},
{id:'craft',title:'Language and rhetorical choices',eyebrow:'02 / Close attention',summary:'Move from naming a device to explaining its work.',items:[
['Tone and shifts','Tone is the speaker’s attitude toward a subject or audience. Support a precise adjective with diction, imagery, syntax, or detail. Trace any shift rather than forcing one label onto an entire text.','“You have ignored us again” suggests frustration; “we can still act together” turns toward hope.','Tone belongs to the speaker’s attitude; mood is the feeling created for the audience.'],
['Diction and connotation','Diction is word choice, including formality, precision, and register. Denotation is a word’s direct meaning; connotations are its associations and emotional coloring.','“Frugal” and “stingy” both concern spending, but their connotations praise restraint or criticize meanness.','Name the actual words and their associations instead of saying “strong diction.”'],
['Syntax','Syntax is the arrangement of words, phrases, and clauses. Analyze length, order, repetition, interruptions, and how information is delayed or emphasized.','After several long explanations, “We waited.” can isolate inaction and create emphasis.','Explain what this structure does in this passage.'],
['Figurative language','Metaphor makes an implied comparison. Simile makes an explicit comparison, often with like or as. Hyperbole exaggerates deliberately. Personification gives human qualities to something nonhuman.','Metaphor: “The policy is a wall.” Simile: “The policy rises like a wall.” Hyperbole: “We waited a century.” Personification: “The city slept.”','Identify what is compared and what the comparison helps an audience see.'],
['Imagery','Imagery uses language that evokes sensory experience: sight, sound, smell, taste, or touch. It can be literal or figurative.','“The cold metal bench pressed through her coat” creates tactile imagery and makes waiting feel uncomfortable.','Imagery does not have to be nonliteral.'],
['Irony','Verbal irony contrasts intended meaning with literal words. Situational irony contrasts events with reasonable expectations. Dramatic irony occurs when an audience knows something a character does not.','Calling a chaotic room “perfectly organized” can be verbal irony; a fire station burning is situational irony.','An unfortunate event alone is not necessarily ironic.'],
['Parallelism and rhetorical strategy','Parallelism repeats grammatical structures to connect or emphasize ideas. A rhetorical strategy is a purposeful way of developing a message, such as comparison, concession, definition, or a call to action.','“We ask for time, we ask for space, we ask for access” gives the demands equal weight and a collective rhythm.','Avoid a device list. Explain how the choice serves the argument.']
]},
{id:'argument',title:'Reasoning and written analysis',eyebrow:'03 / Make the connection',summary:'Support a specific interpretation with evidence and explanation.',items:[
['Reasoning and bias','Reasoning connects evidence to a claim through assumptions or warrants. Bias is a perspective or preference that may shape selection, interpretation, and presentation. Examine evidence and omissions rather than assuming bias makes every claim false.','A survey of only morning visitors may underrepresent students who need evening access.','Ask whether evidence is relevant, sufficient, representative, and connected to the conclusion.'],
['Fallacy and red herring','A fallacy is faulty reasoning. A red herring diverts attention to an irrelevant issue. Examine the logical relationship between the response and the question.','Asked about unsafe stairs, a speaker discusses the school’s athletic trophies. The trophies do not answer the safety concern.','A persuasive tone does not repair a logical gap.'],
['Specificity','Use exact choices, brief evidence, and a concrete explanation of the audience response. Avoid universal claims about what all readers feel.','Vague: “The words affect readers.” Specific: “The phrase ‘our last quiet room’ appeals to students who rely on the library as a refuge.”','Use “invites,” “positions,” or “encourages” when an effect is interpretive, rather than claiming certainty.'],
['Super Analysis Sentence','Practice framework: identify a choice, integrate specific evidence, explain the effect on this audience, and connect it to purpose. This is a general scaffold; the review does not supply your teacher’s required formula.','“By calling the fee a ‘locked gate,’ the student uses metaphor to frame cost as exclusion, encouraging the board to treat free access as a matter of fairness.”','Verify your teacher’s exact Super Analysis Sentence expectations with your class notes.'],
['Major No-Nos','General revision checks: avoid unsupported claims, vague device naming, summary in place of analysis, dropped quotations, comma splices, fragments, and ambiguous pronouns. The review names “Major No-Nos” without listing the classroom rules.','Instead of “This shows pathos,” explain which detail appeals to which audience value and why that helps the writer.','Your teacher’s list may include additional rules. Consult class notes; these are general checks.'],
['Analysis versus evaluation','Analysis explains how a text works. Evaluation judges how effective or valuable it is against criteria. A rhetorical analysis can discuss an effect without reducing the argument to “good,” “bad,” or agreement.','“The cost comparison addresses the board’s budget concerns” is analysis. “This is the best essay” is an unsupported evaluation.','A claim about an audience effect still needs textual evidence and context.']
]},
{id:'grammar',title:'Sentences and punctuation',eyebrow:'04 / Build with intention',summary:'Recognize clause structure, sentence patterns, and phrase boundaries.',items:[
['Clauses and complete sentences','An independent clause expresses a complete thought with a subject and a finite verb. A dependent clause cannot stand alone. A complete sentence contains at least one independent clause. Commands can have an understood “you.”','Fragment: “Although the room was quiet.” Complete: “Although the room was quiet, I could not focus.” Command: “Read closely.”','Length does not determine whether a sentence is complete.'],
['Sentence structure','Simple: one independent clause, no dependent clauses. Compound: at least two independent clauses, no dependent clauses. Complex: one independent clause and at least one dependent clause. Compound-complex: at least two independent clauses and at least one dependent clause.','Simple: “Maya reads and annotates.” Compound: “Maya reads, and Leo writes.” Complex: “While Maya reads, Leo writes.” Compound-complex: “While Maya reads, Leo writes, and I revise.”','A compound subject or verb does not by itself create a compound sentence.'],
['Sentence types by purpose','Declarative sentences state; interrogative sentences ask; imperative sentences command or request; exclamatory sentences express strong feeling. These categories are separate from clause structure.','“Close the door.” is imperative and structurally simple. “Did you read because the exam is tomorrow?” is interrogative and complex.','Check the sentence’s purpose and its clauses separately.'],
['Cumulative and periodic patterns','A cumulative sentence gives the main clause first and adds modifying details. A periodic sentence delays completion of the main clause until after introductory or interrupting material.','Cumulative: “We reached the library, tired from the walk, eager for quiet.” Periodic: “After the long walk, despite our fatigue, we finally reached the library.”','Explain where the main idea arrives and how that placement shapes emphasis.'],
['Inverted and interrupted patterns','Inversion departs from usual subject–verb order. An interrupted pattern inserts material into a main clause. Patterns can overlap with structural sentence categories.','Inverted: “Beyond the gate stood the library.” Interrupted: “The library, despite its small size, served the whole town.”','An interrupted sentence is not automatically a fragment.'],
['Participles and participial phrases','A participle is a verb form used as an adjective; a participial phrase includes the participle and its related words. Place it near the noun it modifies. Set off introductory and nonessential participial phrases with commas; essential modifiers are not normally set off.','“Carrying three books, Maya entered.” The phrase describes Maya. “Students carrying passes may enter.” The phrase identifies which students.','Dangling: “Walking to school, the rain soaked me.” Repair: “Walking to school, I was soaked by the rain.”'],
['Absolute phrases','An absolute phrase generally contains its own noun or pronoun plus a participle or other modifier. It modifies the situation of the whole clause and is set off with commas. It is not an independent clause.','“Her hands trembling, Maya opened the envelope.” “Her hands” belongs to the absolute; Maya is the main clause’s subject.','Compare participial: “Trembling, Maya opened the envelope.”'],
['Semicolons','Join closely related independent clauses with a semicolon. With a conjunctive adverb: independent clause; however, independent clause. Semicolons also separate complicated list items that already contain commas.','“The doors closed; we waited outside.” “The doors closed; however, the lights stayed on.”','Do not use a semicolon merely to introduce an ordinary list after a complete clause; a colon can do that.'],
['Commas','Use commas after introductory dependent clauses, between independent clauses joined by a coordinating conjunction, around nonessential material, and between items in a series. A comma alone cannot join two independent clauses.','“Although it rained, we walked.” “It rained, but we walked.” Comma splice: “It rained, we walked.”','Do not insert a comma between a subject and its verb just because the subject is long.']
]},
{id:'sources',title:'Citations and academic honesty',eyebrow:'05 / Give credit',summary:'Connect borrowed words and ideas to sources readers can find.',items:[
['MLA parenthetical citations','In the usual author–page pattern, give the surname and location: (Rivera 24). If the surname appears in your sentence, give only the page number: Rivera argues … (24). Do not invent page numbers for an unpaginated source.','For an ordinary short quotation: “Quoted words” (Rivera 24). The period follows the citation. These are invented examples for formatting practice.','Cite paraphrases as well as quotations. Use the shortest reference that points clearly to the matching Works Cited entry.'],
['MLA Works Cited','Use a separate page titled Works Cited, double spacing, alphabetical ordering, and hanging indents. Build entries from the relevant core elements: author, source title, container, contributors, version, number, publisher, date, and location.','Invented book: Rivera, Elena. The Shared City. Cedar Press, 2024. In a formatted entry, italicize the book title.','Include the elements that apply to the actual source; do not fill missing information with guesses.'],
['Plagiarism and paraphrase','Plagiarism presents another person’s words or ideas as one’s own. Quote exact wording and cite it. A paraphrase restates meaning with genuinely new wording and structure, and still needs credit. A summary condenses main ideas.','Swapping a few synonyms while keeping the source’s sentence structure is patchwriting, not an adequate independent paraphrase.','Keep source notes separate from your own ideas so you can trace borrowed material.']
]}
];
const PASSAGES=[
{id:'library',title:'A place to stay',type:'Public comment · Civic argument',context:'An original practice speech by a student to a school board considering shorter library hours. All details and figures are fictional.',lines:[
'Before you vote to close the library at four, picture the students who will still be waiting at five. Their buses do not arrive sooner because the doors are locked.',
'I have spent three afternoons each week at those tables. Last month, our student survey counted forty-two students who needed the room after four; thirty of them had no quiet place to work at home.',
'We are not asking for a luxury. We are asking for a desk, a light, a little time. A library should be a bridge to learning, not a gate that closes just as we reach it.',
'If the budget requires a change, let us help design one. Keep the room open two evenings each week, review attendance after a month, and decide with us rather than without us.'
],model:{Speaker:'A student who regularly uses the library.',Occasion:'A school board vote on reducing library hours; the proposed reduction is the exigence.',Audience:'School board members responsible for access and the budget.',Purpose:'Persuade the board to preserve some evening access and include students in the decision.',Subject:'Library hours and equitable access to study space.',Tone:'Concerned and insistent, shifting toward collaborative and practical.'},analysis:'By repeating “We are asking” before a modest list of needs, the student frames extended access as reasonable, encouraging budget-conscious board members to consider a limited compromise.',notes:['Line 1 imagines a concrete consequence of the vote and appeals to concern for students.','Line 2 combines lived experience (ethos) and survey figures (logos); ask how representative the survey is.','Line 3 uses parallelism and the bridge/gate metaphor to frame access as an equity issue.','Line 4 acknowledges budget constraints and offers a testable compromise.']},
{id:'trees',title:'What shade is worth',type:'Letter · Environmental argument',context:'An original practice letter from a longtime resident to a city council weighing a tree-removal proposal. The project is fictional.',lines:[
'For twenty summers, the sycamores outside my apartment have cooled the pavement and sheltered the bus stop. Now the plan calls them “obstructions.” A word can make a living canopy sound like a pile of broken chairs.',
'I understand the need to repair the sidewalk. My neighbor uses a wheelchair, and the lifted concrete has narrowed her route. Safety is a duty, not a detail to dismiss.',
'Yet repair need not mean removal. Before the city exchanges decades of shade for a week of faster construction, ask engineers to compare rerouting the path with cutting every tree.',
'Build a street we can travel on. Keep a street we can bear to stand on.'
],model:{Speaker:'A longtime resident familiar with the trees and sidewalk.',Occasion:'A proposed sidewalk project that would remove mature trees.',Audience:'City council members deciding how to repair the sidewalk.',Purpose:'Seek an engineering comparison that could preserve trees while improving accessibility.',Subject:'Balancing safe access and mature tree cover.',Tone:'Protective, then conceding and pragmatic, ending urgently.'},analysis:'By acknowledging the wheelchair user’s blocked route, the resident concedes a serious safety concern and builds credibility with council members before proposing an alternative repair.',notes:['Line 1 contests the connotations of “obstructions” by contrasting a living canopy with discarded furniture.','Line 2 makes a concession, showing that the writer recognizes a competing public need.','Line 3 contrasts decades with a week to emphasize long-term consequences.','Line 4 repeats imperative structures to give access and comfort parallel importance.']}

function writtenInput(q,e){return`<p>${esc(q.instructions)}</p>${q.type==='sentence'?`<p class="assigned-word">Assigned word: <strong>${esc(e.wordAssignments[q.id])}</strong></p>`:''}<label class="field" for="exam-response">${q.exactSource?'Your answer or selected option(s)':`Your ${q.type==='sentence'?'original sentence':'response'}`} · ${q.maxPoints} ${q.exactSource?'source':'practice writing'} point${q.maxPoints===1?'':'s'} after submission</label><textarea class="exam-response ${q.type==='sentence'?'short':''}" id="exam-response" data-exam-response="${q.id}" maxlength="20000" placeholder="${q.exactSource?'Record your answer here…':'Write your response here…'}">${esc(e.answers[q.id]||'')}</textarea><div class="sentence-bottom"><span>Saved as you type</span><span id="exam-word-count">${wordCount(e.answers[q.id]||'')} words</span></div>`}
function answerFeedback(q,a){return`<div class="feedback ${correct(q,a)?'':'incorrect'}" role="status"><strong>${correct(q,a)?'✓ Correct':'Review this one'}</strong><p>Answer: ${esc(answerText(q,q.answer))}</p><p>${esc(q.why)}</p></div>`}
function examSummary(e=state.exam){const s={score:0,total:0,topics:{},writingScore:0,writingMax:0,writingAssessed:0,writingCount:0};for(const id of e.ids){const q=questionByID(id);if(isWritten(q)){s.writingCount++;s.writingMax+=q.maxPoints;const r=e.rubrics?.[id]||{},assessed=q.criteria.every(c=>Number.isInteger(r[c.id]));if(assessed){s.writingAssessed++;s.writingScore+=q.criteria.reduce((sum,c)=>sum+r[c.id],0)}}else{const ok=correct(q,e.answers[id]);s.total++;s.score+=Number(ok);s.topics[q.topic]||={score:0,total:0};s.topics[q.topic].total++;s.topics[q.topic].score+=Number(ok)}}return s}
function storeAttempt(){const e=state.exam,s=examSummary(e);state.attempts||=[];state.attempts=state.attempts.filter(a=>a.id!==e.id);state.attempts.push(JSON.parse(JSON.stringify(e)));state.attempts=state.attempts.slice(-12);const h={id:e.id,date:e.finishedAt,mode:e.mode,total:s.total,score:s.score,topics:s.topics};const n=state.history.findIndex(h=>h.id===e.id);if(n>=0)state.history[n]=h;else state.history.push(h);state.history=state.history.slice(-100)}
function submitExam(){if(state.exam?.submitted)return;checkpointExam();const e=state.exam;e.submitted=true;e.paused=true;e.runningSince=null;e.finishedAt=Date.now();recordExamEvidence(e);storeAttempt();save();if($('#dialog').open)closeDialog();examScreen='session';examReviewFilter='all';render()}
function requestExamSubmit(){const e=state.exam,source=e.form==='source',objective=e.ids.filter(id=>!isWritten(questionByID(id))&&!isAnswered(e,id)).length,writing=e.ids.filter(id=>isWritten(questionByID(id))&&!isAnswered(e,id)).length,flags=e.ids.filter(id=>e.flagged[id]).length;dialog(`<h2>Ready to submit?</h2><p>${source?'Your answers will lock and each supplied point value will be available for manual scoring.':objective?objective+' objective question'+(objective===1?' is':'s are')+' unanswered and will receive no points.':'All objective questions are answered.'}</p>${writing?`<p>${writing} ${source?'source question':'writing task'}${writing===1?' has':'s have'} no response yet.</p>`:''}<p class="tiny muted">${flags} flagged for review. ${source?'The pasted export does not contain a complete official key, so no answers are invented.':'After submission, answers are locked and explanations unlock. Writing is reviewed separately. Local rubrics stay available; ChatGPT grading is optional.'}</p>${source?'':aiExamSubmissionOption(e)}<div class="button-row"><button class="btn secondary" data-action="close-dialog">Keep working</button><button class="btn secondary" data-action="confirm-submit">Submit & review locally</button></div>`)}
function examResults(){const e=state.exam,s=examSummary(e),source=e.form==='source',missed=e.ids.filter(id=>!isWritten(questionByID(id))&&!correct(questionByID(id),e.answers[id])),assessed=s.writingAssessed===s.writingCount;const weak=Object.entries(s.topics).filter(([k,v])=>v.score<v.total).sort((a,b)=>a[1].score/a[1].total-b[1].score/b[1].total);return head(source?'EXACT SOURCE / REVIEW & SCORE': 'YOUR RESULTS / REVIEW WITH PURPOSE',examTitle(e),source?'Review each saved response and enter earned points using your instructor’s key, rubric, or returned work. The supplied text did not contain a complete official answer key.':'Study the explanations, assess your writing against the rubrics, then give the difficult questions another try.')+`
 <div class="results-grid">${source?'':`<div class="result-hero"><span class="eyebrow">OBJECTIVE SCORE · AUTOMATIC</span><div class="score">${s.total?Math.round(s.score/s.total*100):0}<span style="font-size:30px">%</span></div><h2>${s.score} of ${s.total} correct</h2><p>Unanswered objective questions earn zero.<br>${formatTime(examElapsed(e))} active time${e.continued?' · Continued beyond the timer':''}</p></div>`}${s.writingMax?`<div class="writing-result card"><span class="eyebrow">${source?'SUPPLIED POINT VALUES · MANUAL SCORING':'WRITING · PRACTICE REVIEW'}</span><h2 id="writing-score">${assessed?s.writingScore+' / '+s.writingMax:'Pending review'}</h2><p id="writing-status" class="tiny muted">${s.writingAssessed} of ${s.writingCount} ${source?'source items scored from the supplied point values.':'rubrics completed. Local review or optional ChatGPT assessment.'}</p><strong id="combined-score" class="tiny">${assessed?(source?'Recorded source-set score: '+s.writingScore+' / '+s.writingMax:'Combined practice total: '+(s.score+s.writingScore)+' / '+(s.total+s.writingMax)+' (practice writing review)'):(source?'A total appears after all source items are scored.':'A combined total appears after all writing rubrics are complete.')}</strong><button class="btn secondary small space-top" data-action="exam-review-filter" data-value="written">Score saved responses →</button></div>`:''}</div>
 <div class="button-row">${source?'':`<button class="btn" data-action="retry-missed" ${!missed.length?'disabled':''}>Practice ${missed.length} missed questions ↗</button>`}<button class="btn secondary" data-action="exam-hub">Exam overview</button><button class="utility" data-action="exam-download">↓ Download attempt</button></div>
 ${source?'':`<div class="grid two space-top"><section class="card"><h3>Objective performance by topic</h3>${breakdown(s.topics)}</section><section class="card"><h3>Your next study session</h3>${weak.length?weak.slice(0,3).map(([id,v])=>`<div class="study-next"><div><strong>${TOPICS[id]}</strong><span>${v.total-v.score} missed of ${v.total}</span></div><button class="utility" data-action="exam-study-topic" data-value="${id}">Review →</button></div>`).join(''):'<p class="tiny muted">Every objective answer was correct. Complete the writing review, then try another attempt with rotated choices.</p>'}<p class="tiny muted space-top">These results describe this attempt; they do not predict an official exam grade.</p></section></div>`}

function answerReview(e){const ids=e.ids.filter(id=>{const q=questionByID(id);return examReviewFilter==='all'||examReviewFilter==='missed'&&!isWritten(q)&&!correct(q,e.answers[id])||examReviewFilter==='written'&&isWritten(q)||examReviewFilter==='flagged'&&e.flagged[id]});return ids.map(id=>{const q=questionByID(id),a=e.answers[id],written=isWritten(q),ok=correct(q,a),num=e.ids.indexOf(id)+1;return`<details class="exam-review-item" ${examReviewFilter==='written'?'open':''}><summary><span class="review-indicator ${written?'writing':ok?'good':'bad'}">${written?'✎':ok?'✓':'↻'}</span><span>${num}. ${q.type==='sentence'?'Original sentence: '+esc(e.wordAssignments[id]):esc(q.prompt)}</span><small>${written?'Writing review':ok?'Correct':'Review'}</small></summary><div class="review-content">${passageHTML(q,e,true)}<p class="eyebrow">YOUR ${written?'RESPONSE':'ANSWER'}</p><div class="response-copy">${esc(answerText(q,a))}</div>${written?writingReview(q,e):`<p><strong>Correct answer:</strong> ${esc(answerText(q,q.answer))}</p><p>${esc(q.why)}</p><p class="tiny muted">${TOPICS[q.topic]} · ${e.flagged[id]?'Flagged during the attempt':'Not flagged'}</p>`}</div></details>`}).join('')||'<p class="empty">No responses match this filter.</p>'}
function writingReview(q,e){const assigned=e.wordAssignments[q.id],v=VOCAB.find(v=>v.word===assigned),r=e.rubrics[q.id]||{};let sample=q.sample;if(q.type==='sentence')sample=v.example;const sourceNote=q.exactSource?`<div class="sample-response source-review-key"><span class="eyebrow">AI-INFERRED STUDY KEY · NOT AN OFFICIAL TEACHER KEY</span><p>${esc(q.sourceKey)}</p><p class="tiny muted">The supplied export gives the question and its maximum point value, not a complete answer key. This is a best-effort study judgment; use your instructor’s returned work or key if it differs.</p></div>`:`<div class="sample-response"><span class="eyebrow">${q.type==='sentence'?'USAGE EXAMPLE':'SAMPLE RESPONSE'}</span><p>${esc(sample)}</p><p class="tiny muted">One possible response. Other accurate, evidence-based answers can also earn credit.${q.type==='sentence'?' Your exam sentence should be original.':''}</p></div>`;return`${sourceNote}${q.type==='sentence'?`<p class="tiny">${esc(v.word)}: ${esc(v.def)}</p><p class="tiny muted">Word presence check: ${examWordPresent(e.answers[q.id]||'',assigned)?'selected word or a recognized form found':'selected word not found'}. This check does not assess meaning or grammar.</p>`:''}<fieldset class="rubric"><legend>${q.exactSource?'Record your score · ':'Self-assessment · '}${q.maxPoints} possible points</legend><p class="tiny muted">${q.exactSource?'Compare your response with the study key and your instructor’s materials, then record earned points.':'Compare your response with each criterion. Select 0 when it is absent or inaccurate; leave a criterion blank until you have assessed it.'}</p>${q.criteria.map(c=>`<div class="rubric-row"><div><label for="grade-${q.id}-${c.id}">${esc(c.label)}</label><p>${esc(c.guide)}</p></div><select id="grade-${q.id}-${c.id}" data-exam-rubric="${q.id}" data-criterion="${c.id}" aria-label="${esc(c.label)} score"><option value="">Not assessed</option>${Array.from({length:c.max+1},(_,i)=>`<option value="${i}" ${r[c.id]===i?'selected':''}>${i} / ${c.max}</option>`).join('')}</select></div>`).join('')}</fieldset>`}
function examWordPresent(text,word){const forms=[word,...(WORD_FORMS[word]||[])].map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\/*EXAM_FEATURE*/'));return new RegExp('(^|[^a-z])(?:'+forms.join('|')+')([^a-z]|$)','i').test(text)}
function refreshWritingTotals(){const s=examSummary(),done=s.writingAssessed===s.writingCount,source=state.exam?.form==='source';$('#writing-score').textContent=done?s.writingScore+' / '+s.writingMax:'Pending review';$('#writing-status').textContent=source?s.writingAssessed+' of '+s.writingCount+' source items scored from the supplied point values.':s.writingAssessed+' of '+s.writingCount+' rubrics completed. Local review or optional ChatGPT assessment.';$('#combined-score').textContent=done?(source?'Recorded source-set score: '+s.writingScore+' / '+s.writingMax:'Combined practice total: '+(s.score+s.writingScore)+' / '+(s.total+s.writingMax)+' (practice writing review)'):(source?'A total appears after all source items are scored.':'A combined total appears after all writing rubrics are complete.')}
function refreshExamCounts(){const e=state.exam,done=e.ids.filter(id=>isAnswered(e,id)).length;$('#exam-completion').textContent=done+'/'+e.ids.length+' responses';$('#exam-progress-fill').style.width=done/e.ids.length*100+'%';for(const s of examSections(e)){const label=document.querySelector('[data-section-count="'+s.id+'"]');if(label)label.textContent=s.ids.filter(id=>isAnswered(e,id)).length+'/'+s.ids.length}const b=document.querySelector('[data-action=exam-jump][data-value="'+e.index+'"]');b?.classList.toggle('answered',isAnswered(e,e.ids[e.index]))}
function paintExam(preserve=false){const y=scrollY;$('#main').innerHTML=renderExam();updateClock();if(preserve)window.scrollTo(0,y);else{window.scrollTo(0,0);$('#main').focus({preventScroll:true})}}
function setExamAnswer(el){const e=state.exam;if(!e||e.paused||e.submitted||examScreen!=='session')return;const id=e.ids[e.index],q=questionByID(id);if(isWritten(q)||e.mode==='quick'&&e.checked[id])return;e.answers[id]=q.type==='multi'?[...document.querySelectorAll('input[name=answer]:checked')].map(x=>Number(x.value)):Number(el.value);save();const y=scrollY;$('#main').innerHTML=examActive();updateClock();window.scrollTo(0,y);document.querySelector('input[name=answer][value="'+el.value+'"]')?.focus({preventScroll:true})}
function updateClock(){const e=state.exam;if(!e||e.submitted||e.paused)return;const elapsed=examElapsed(e),remaining=e.timeLimit-elapsed;if(e.timeLimit&&!e.continued&&remaining<=0){e.timerExpired=true;pauseExam();if(route==='exam'&&examScreen==='session'){if($('#dialog').open)closeDialog();paintExam()}return}const clock=$('#exam-clock');if(clock){clock.textContent=e.timeLimit&&!e.continued?formatTime(remaining)+' remaining':formatTime(elapsed)+' active';clock.classList.toggle('time-low',e.timeLimit>0&&!e.continued&&remaining<300000)}if(!e.lastSavedAt||Date.now()-e.lastSavedAt>=10000){e.lastSavedAt=Date.now();save()}}
function requestExamStart(mode,ids,settings={}){if(state.exam&&!state.exam.submitted){pauseExam();pendingExamStart={mode,ids,settings};dialog('<h2>Start a new attempt?</h2><p>You have an unfinished practice session. Starting a new one replaces that active draft. Your Sentence studio, study notes, and completed attempts are kept.</p><div class="button-row"><button class="btn secondary" data-action="close-dialog">Keep current attempt</button><button class="btn" data-action="exam-confirm-start">Start new attempt</button></div>')}else beginExam(mode,ids,settings)}
function handleExamAction(a,v,el){
 if(!a.startsWith('exam-')&&!['start-full','start-quick','start-exact-source','retry-missed','confirm-submit','check-answer','toggle-missed'].includes(a))return false;
 if(a==='start-full'){const settings={minutes:Number($('#exam-duration').value),mix:$('#exam-mix').checked};state.examPreferences=settings;save();requestExamStart('full',null,settings)}
 else if(a==='start-quick'){const topic=$('#quick-topic').value;requestExamStart('quick',shuffle(OBJECTIVE_QUESTIONS.filter(q=>topic==='all'||q.topic===topic)).slice(0,10).map(q=>q.id),{mix:true})}
 else if(a==='start-exact-source'){toast('Preparing the exact supplied questions…');loadExactSourceQuestions().then(ids=>requestExamStart('full',ids,{exactSource:true,mix:false})).catch(()=>toast('The exact question source could not be loaded. Please refresh and try again.'))}
 else if(a==='exam-confirm-start'){const p=pendingExamStart;pendingExamStart=null;closeDialog();if(p)beginExam(p.mode,p.ids,p.settings)}
 else if(a==='exam-blueprint')$('#exam-blueprint').scrollIntoView({behavior:'smooth',block:'start'});
 else if(a==='exam-resume'){const e=state.exam;if(!e)return;if(e.submitted){examScreen='session';paintExam();return}if(e.timerExpired&&!e.continued){examScreen='session';paintExam();return}e.paused=false;e.runningSince=Date.now();examScreen='session';save();paintExam()}
 else if(a==='exam-continue'){state.exam.continued=true;state.exam.paused=false;state.exam.runningSince=Date.now();save();paintExam()}
 else if(a==='exam-pause'){pauseExam();paintExam()}
 else if(a==='exam-exit'||a==='exam-hub'||a==='exam-new'){pauseExam();examScreen='hub';paintExam()}
 else if(a==='exam-open-attempt'){const attempt=state.attempts.find(e=>e.id===v)||(state.exam?.id===v?state.exam:null);if(attempt){if(state.exam&&!state.exam.submitted){toast('Finish the active attempt before opening a completed one.');return}state.exam=JSON.parse(JSON.stringify(attempt));examScreen='session';examReviewFilter='all';save();paintExam()}}
 else if(a==='exam-prev'||a==='exam-next'||a==='exam-jump'||a==='exam-section'||a==='exam-next-unanswered'){const e=state.exam;if(!e||e.paused||e.submitted)return;if(a==='exam-prev')e.index=Math.max(0,e.index-1);else if(a==='exam-next')e.index=Math.min(e.ids.length-1,e.index+1);else if(a==='exam-jump')e.index=Math.max(0,Math.min(Number(v),e.ids.length-1));else if(a==='exam-section'){const ids=examSections(e).find(s=>s.id===v)?.ids;if(ids)e.index=e.ids.indexOf(ids.find(id=>!isAnswered(e,id))||ids[0])}else{const rest=[...e.ids.slice(e.index+1),...e.ids.slice(0,e.index+1)];const id=rest.find(id=>!isAnswered(e,id));if(id)e.index=e.ids.indexOf(id);else toast('Every response has an answer.')}examNavFilter='all';save();paintExam()}
 else if(a==='exam-flag'){const e=state.exam,id=e.ids[e.index];e.flagged[id]=!e.flagged[id];save();paintExam(true)}
 else if(a==='exam-mark-line'){const e=state.exam,q=questionByID(e.ids[e.index]),i=Number(v);e.marks[q.passage]||=[];const marks=e.marks[q.passage];e.marks[q.passage]=marks.includes(i)?marks.filter(n=>n!==i):[...marks,i];save();const line=el.closest('.passage-line');line.classList.toggle('marked');el.setAttribute('aria-pressed',e.marks[q.passage].includes(i))}
 else if(a==='check-answer'){const e=state.exam,id=e.ids[e.index];if(isAnswered(e,id)){e.checked[id]=true;recordExamEvidence(e,id);save();paintExam(true)}}
 else if(a==='exam-submit')requestExamSubmit();
 else if(a==='confirm-submit')submitExam();
 else if(a==='retry-missed'){const e=state.exam,ids=e.ids.filter(id=>!isWritten(questionByID(id))&&!correct(questionByID(id),e.answers[id]));if(ids.length)requestExamStart('quick',shuffle(ids),{retry:true,mix:true})}
 else if(a==='exam-review-filter'||a==='toggle-missed'){examReviewFilter=v||'missed';paintExam(true);$('#exam-answer-review')?.scrollIntoView({block:'start'})}
 else if(a==='exam-study-topic'){guideTab=v==='vocabulary'?'vocabulary':v;guideQuery='';go('guide')}
 else if(a==='exam-download')downloadAttempt();

let vocabScreen='hub',vocabSearch='',vocabFilter='all';
function freshVocabulary(){return{preferences:{count:5,scope:'priority'},records:{},session:null,history:[]}}
function validateVocabulary(x){const out=freshVocabulary();if(!x||typeof x!=='object')return out;out.preferences={count:[5,10,34].includes(x.preferences?.count)?x.preferences.count:5,scope:x.preferences?.scope==='all'?'all':'priority'};for(const v of VOCAB){const r=x.records?.[v.id];if(!r)continue;out.records[v.id]={learned:r.learned===true,meaning:r.meaning&&typeof r.meaning.correct==='boolean'?{correct:r.meaning.correct,lastAt:Number(r.meaning.lastAt)||0}:null,recall:r.recall&&typeof r.recall.correct==='boolean'?{correct:r.recall.correct,assisted:r.recall.assisted===true,lastAt:Number(r.recall.lastAt)||0}:null,writing:{text:String(r.writing?.text||'').slice(0,10000),meaning:r.writing?.meaning===true,grammar:r.writing?.grammar===true,reviewed:r.writing?.reviewed===true,lastAt:Number(r.writing?.lastAt)||0}}}out.history=(Array.isArray(x.history)?x.history:[]).filter(h=>typeof h.id==='string'&&Number.isFinite(h.date)).slice(-30).map(h=>({id:h.id.slice(0,100),date:h.date,words:Number(h.words)||0,correct:Number(h.correct)||0,total:Number(h.total)||0,writing:Number(h.writing)||0}));const s=x.session;if(s&&Array.isArray(s.words)&&s.words.length>0&&s.words.length<=34&&new Set(s.words).size===s.words.length&&s.words.every(id=>VOCAB.some(v=>v.id===id))){const tasks=s.words.flatMap(()=>[]);for(const stage of ['learn','meaning','recall','writing'])for(const id of s.words)tasks.push({id:stage+'-'+id,stage,ref:id});const response={};for(const t of tasks){const r=s.responses?.[t.id]||{};response[t.id]={done:r.done===true,checked:r.checked===true,answer:Number.isInteger(r.answer)&&r.answer>=0&&r.answer<4?r.answer:null,typed:String(r.typed||'').slice(0,150),assisted:r.assisted===true,skipped:r.skipped===true};if(t.stage==='meaning'&&response[t.id].checked)response[t.id].correct=meaningChoices(t.ref)[response[t.id].answer]?.id===t.ref;if(t.stage==='recall'&&response[t.id].checked)response[t.id].correct=normalizeWord(response[t.id].typed)===normalizeWord(VOCAB.find(v=>v.id===t.ref).word)}out.session={id:String(s.id||'vocabulary-'+Date.now()).slice(0,100),started:Number(s.started)||Date.now(),finished:s.finished===true,words:[...s.words],tasks,index:Math.max(0,Math.min(Number(s.index)||0,tasks.length-1)),responses:response}}return out}
function vocabRecord(id){return state.vocabulary.records[id]||=( {learned:false,meaning:null,recall:null,writing:{text:'',meaning:false,grammar:false,reviewed:false,lastAt:0}})}
function wordPathComplete(id){const r=state.vocabulary.records[id];return !!r?.learned&&r.meaning?.correct===true&&r.recall?.correct===true&&!r.recall.assisted&&r.writing?.reviewed===true&&vocabWritingChecks(id).pass}
function wordNeedsWork(id){const r=state.vocabulary.records[id],card=state.learning.cards[id];if(wordPathComplete(id)){const lastPractice=Math.max(r.meaning.lastAt||0,r.recall.lastAt||0,r.writing.lastAt||0);return !!card&&(card.dueAt<=Date.now()||card.rating==='again'&&card.lastAt>lastPractice)}return state.known[id]!==true||r?.meaning?.correct===false||r?.recall?.correct===false||r?.recall?.assisted===true||!!r?.writing?.text&&!r.writing.reviewed}
function normalizeWord(s){return String(s).toLowerCase().trim().replace(/\s+/g,' ')}
function meaningChoices(id){const i=VOCAB.findIndex(v=>v.id===id),options=[VOCAB[i],VOCAB[(i+7)%34],VOCAB[(i+15)%34],VOCAB[(i+23)%34]],n=i%4;return[...options.slice(n),...options.slice(0,n)]}
function vocabWritingChecks(id){const v=VOCAB.find(v=>v.id===id),w=state.vocabulary.records[id]?.writing||{text:''},issues=[];if(!w.text.trim())issues.push('Write your own complete sentence.');else{if(!examWordPresent(w.text,v.word))issues.push('Use “'+v.word+'” or a common inflected form.');if(wordCount(w.text)<7)issues.push('Add enough context to reach at least seven words.');if(!/[.!?][”"')\]]*$/.test(w.text.trim()))issues.push('Add ending punctuation.');if(normalizeWord(w.text)===normalizeWord(v.example))issues.push('Write an original sentence instead of copying the example.')}return{pass:!issues.length,issues}}
function renderVocabulary(){if(vocabScreen==='hub'||!state.vocabulary.session)return vocabHub();return state.vocabulary.session.finished?vocabResults():vocabSession()}
function vocabHub(){const s=state.vocabulary.session,complete=VOCAB.filter(v=>wordPathComplete(v.id)).length;return head('VOCABULARY LAB / ALL 34 REVIEW WORDS','Know it. Recall it. Use it.','Follow a complete practice path: learn the word, recognize its meaning, recall it without choices, and write an original sentence. Every stage saves separately.')+`${s&&!s.finished?`<div class="resume-banner"><div><span class="eyebrow">SAVED VOCABULARY SESSION</span><strong>Round ${Math.floor(s.index/s.words.length)+1} of 4 · ${VOCAB.find(v=>v.id===s.tasks[s.index].ref).word}</strong><span>${Object.values(s.responses).filter(r=>r.done).length}/${s.tasks.length} steps completed. Typed answers and drafts are saved.</span></div><button class="btn" data-action="vocab-resume">Resume my exact step →</button></div>`:''}<section class="cram-hero card"><div><span class="eyebrow">A COMPLETE PRACTICE PATH</span><h2>Move a word<br>into your own writing.</h2><ol class="vocab-path"><li><strong>Learn</strong><span>Meaning, part of speech, example, and a usage distinction.</span></li><li><strong>Recognize</strong><span>Choose the correct meaning and see why it fits.</span></li><li><strong>Recall</strong><span>Type the word from its definition without answer choices.</span></li><li><strong>Use</strong><span>Write an original sentence and check meaning and grammar.</span></li></ol></div><div class="cram-setup"><h3>Choose your word set</h3><label class="field" for="vocab-count">Words this session</label><select id="vocab-count">${[5,10,34].map(n=>`<option value="${n}" ${state.vocabulary.preferences.count===n?'selected':''}>${n===34?'All 34 review words':n+' words'} · ${n*4} steps</option>`).join('')}</select><label class="field" for="vocab-scope">Order</label><select id="vocab-scope"><option value="priority" ${state.vocabulary.preferences.scope==='priority'?'selected':''}>My unfinished and difficult words first</option><option value="all" ${state.vocabulary.preferences.scope==='all'?'selected':''}>All words in shuffled order</option></select><p class="tiny muted space-top">Each round covers the whole selected set before the next round begins. Original sentences save here separately from your ten-sentence assignment.</p><button class="btn" data-action="vocab-start">Start vocabulary practice ↗</button></div></section><section class="cram-overview"><div><strong>${complete}<small> / 34</small></strong><span>Complete practice paths</span></div><div><strong>${VOCAB.filter(v=>state.vocabulary.records[v.id]?.meaning?.correct).length}</strong><span>Latest meaning check correct</span></div><div><strong>${VOCAB.filter(v=>state.vocabulary.records[v.id]?.recall?.correct&&!state.vocabulary.records[v.id]?.recall?.assisted).length}</strong><span>Recalled without a hint</span></div><div><strong>${VOCAB.filter(v=>state.vocabulary.records[v.id]?.writing?.reviewed).length}</strong><span>Original sentences reviewed</span></div></section><div class="section-head"><h2>Your word-by-word progress</h2><span class="tiny muted">A complete path is practice evidence, not a mastery guarantee</span></div><div class="toolbar"><input id="vocab-search" class="search" aria-label="Search vocabulary progress" placeholder="Find a word…" value="${esc(vocabSearch)}"><label class="tiny" for="vocab-filter">Show</label><select id="vocab-filter"><option value="all" ${vocabFilter==='all'?'selected':''}>All words</option><option value="unfinished" ${vocabFilter==='unfinished'?'selected':''}>Incomplete paths</option><option value="difficult" ${vocabFilter==='difficult'?'selected':''}>Incorrect or assisted checks</option><option value="complete" ${vocabFilter==='complete'?'selected':''}>Complete paths</option></select></div><div id="vocab-progress-list">${vocabProgressList()}</div><div class="button-row space-top"><button class="utility" data-action="vocab-export">↓ Export word progress and writing</button><button class="utility" data-action="export">↓ Back up all saved work</button></div>`}
function vocabProgressList(){const rows=VOCAB.filter(v=>v.word.includes(vocabSearch.toLowerCase())).filter(v=>{const r=state.vocabulary.records[v.id];return vocabFilter==='all'||vocabFilter==='unfinished'&&!wordPathComplete(v.id)||vocabFilter==='complete'&&wordPathComplete(v.id)||vocabFilter==='difficult'&&(r?.meaning?.correct===false||r?.recall?.correct===false||r?.recall?.assisted)});return rows.map(v=>{const r=state.vocabulary.records[v.id]||{},status=(value,yes,no='Not practiced')=>value===true?['complete',yes]:value===false?['pending','Retry']:['neutral',no];const badges=[status(r.learned||undefined,'Learned'),status(r.meaning?.correct,'Meaning correct'),r.recall?.assisted?['pending','Recall used a hint']:status(r.recall?.correct,'Recalled'),status(r.writing?.reviewed||undefined,'Writing reviewed',r.writing?.text?'Writing draft':'No writing yet')];return`<article class="vocab-progress-row ${wordPathComplete(v.id)?'path-complete':''}"><div><h3>${v.word}</h3><span class="tiny muted">${v.pos}</span></div><div class="vocab-stage-badges">${badges.map(([css,text])=>`<span class="learning-badge ${css}">${text}</span>`).join('')}</div><button class="utility" data-action="vocab-one" data-value="${v.id}">Practice this word →</button></article>`}).join('')||'<p class="empty">No words match this filter.</p>'}
function buildVocabSession(words){pauseExam();pauseCram();const tasks=['learn','meaning','recall','writing'].flatMap(stage=>words.map(ref=>({id:stage+'-'+ref,stage,ref})));state.vocabulary.session={id:'vocabulary-'+Date.now(),started:Date.now(),finished:false,words,tasks,index:0,responses:{}};vocabScreen='session';save();paintVocabulary()}
function chooseVocabWords(count,scope){let words=shuffle(VOCAB);if(scope==='priority'){const rank=v=>{const r=state.vocabulary.records[v.id];return r?.meaning?.correct===false||r?.recall?.correct===false||r?.recall?.assisted?0:!r?1:!wordPathComplete(v.id)?2:3};words.sort((a,b)=>rank(a)-rank(b))}return words.slice(0,count).map(v=>v.id)}
function vocabSession(){const s=state.vocabulary.session,t=s.tasks[s.index],v=VOCAB.find(v=>v.id===t.ref),r=s.responses[t.id]||=( {}),record=vocabRecord(v.id),names={learn:'Learn the word',meaning:'Choose its meaning',recall:'Recall from memory',writing:'Use it in your own sentence'};return`<div class="exam-bar"><div><span class="eyebrow">VOCABULARY LAB · ROUND ${Math.floor(s.index/s.words.length)+1} OF 4</span><h2>${names[t.stage]}</h2></div><div class="exam-metrics"><span>${Object.values(s.responses).filter(r=>r.done).length}/${s.tasks.length} completed</span><button class="utility" data-action="vocab-hub">Save & leave</button></div></div><div class="progress-track"><span style="width:${Object.values(s.responses).filter(r=>r.done).length/s.tasks.length*100}%"></span></div><div class="vocab-session-layout space-top"><section class="card vocab-exercise"><span class="eyebrow">WORD ${s.words.indexOf(v.id)+1} OF ${s.words.length}</span>${vocabExercise(t,v,r,record)}<div class="q-footer"><button class="utility" data-action="vocab-skip">Leave unfinished for later</button><button class="btn" data-action="vocab-next" ${!r.done?'disabled':''}>${s.index===s.tasks.length-1?'See my results':'Next →'}</button></div></section><aside class="card"><span class="eyebrow">FOUR ROUNDS</span><div class="vocab-rounds">${['learn','meaning','recall','writing'].map((stage,i)=>`<button data-action="vocab-round" data-value="${stage}" class="${t.stage===stage?'selected':''}"><strong>${i+1}. ${{learn:'Learn',meaning:'Recognize',recall:'Recall',writing:'Use'}[stage]}</strong><span>${s.words.filter(id=>s.responses[stage+'-'+id]?.done).length}/${s.words.length}</span></button>`).join('')}</div><p class="tiny muted">Your answers save before you check them. Hinted recall is labeled separately. Writing uses local self-review or imported ChatGPT feedback.</p><button class="utility" data-action="vocab-end">End & review this session</button></aside></div>`}
function vocabExercise(t,v,r,record){if(t.stage==='learn')return`<h2 class="cram-card-title">${v.word}</h2><span class="pill neutral">${v.pos}</span><p class="vocab-definition">${v.def}</p><div class="example">${v.example}</div><p class="tip">${v.tip}</p><button class="btn small space-top" data-action="vocab-learn" ${r.done?'disabled':''}>${r.done?'✓ Learning step saved':'I have studied this word'}</button><p class="tiny muted">Recognition and recall in the next rounds will check what you remember.</p>`;if(t.stage==='meaning')return`<h2>What does “${v.word}” mean?</h2><div role="group" aria-label="Choose a definition">${meaningChoices(v.id).map((w,i)=>`<label class="option"><input type="radio" name="vocab-meaning" value="${i}" ${r.answer===i?'checked':''} ${r.checked?'disabled':''}><span>${esc(w.def)}</span></label>`).join('')}</div>${r.checked?`<div class="feedback ${r.correct?'':'incorrect'}"><strong>${r.correct?'✓ Correct':'Review the meaning'}</strong><p>${v.word}: ${v.def}</p><p>${v.tip}</p></div>`:`<button class="btn small space-top" data-action="vocab-check-meaning" ${!Number.isInteger(r.answer)?'disabled':''}>Check meaning</button>`}`;if(t.stage==='recall')return`<span class="eyebrow">DEFINITION → WORD</span><h2 class="recall-definition">${v.def}</h2><p class="tiny muted">Type the exact review word or phrase. Capitalization and extra spaces do not matter.</p><label class="field" for="vocab-recall">Your word</label><input class="recall-input" id="vocab-recall" data-vocab-recall value="${esc(r.typed||'')}" maxlength="150" autocomplete="off" spellcheck="false" autocapitalize="off" ${r.checked?'disabled':''}>${r.assisted?`<p class="tiny muted">Hint used: begins with “${v.word[0]}” · ${v.word.replace(/ /g,'').length} letters${v.word.includes(' ')?' in two words':''}.</p>`:''}${r.checked?`<div class="feedback ${r.correct?'':'incorrect'}"><strong>${r.correct?'✓ Correct'+(r.assisted?' with a hint':' without a hint'):'The word is '+v.word}</strong><p>${v.word}: ${v.def}</p><p>${v.tip}</p></div>`:`<div class="button-row space-top"><button class="btn small" data-action="vocab-check-recall" ${!r.typed?.trim()?'disabled':''}>Check recall</button><button class="utility" data-action="vocab-hint">Show a hint</button></div>`}`;const w=record.writing,c=vocabWritingChecks(v.id);return`<h2>Make “${v.word}” your own.</h2><p>${v.def}</p><label class="field" for="vocab-writing">Your original sentence</label><textarea id="vocab-writing" data-vocab-writing="${v.id}" maxlength="10000">${esc(w.text)}</textarea><p id="vocab-writing-feedback" class="tiny ${c.pass?'good':'bad'}">${c.pass?'Basic checks passed. Review the meaning and grammar below.':esc(c.issues.join(' '))}</p><div class="self-checks"><label><input type="checkbox" data-vocab-self="meaning" ${w.meaning?'checked':''}>The context demonstrates the meaning</label><label><input type="checkbox" data-vocab-self="grammar" ${w.grammar?'checked':''}>The sentence is complete, original, and correctly punctuated</label></div><button class="btn small space-top" id="vocab-review-writing" data-action="vocab-review-writing" ${!c.pass||!w.meaning||!w.grammar?'disabled':''}>Save my writing self-review</button><p class="tiny muted">Checks can find word use, length, punctuation, and a copied example. You assess meaning, originality, and grammar.</p>`}
function paintVocabulary(preserve=false){const y=scrollY;$('#main').innerHTML=renderVocabulary();if(preserve)scrollTo(0,y);else{scrollTo(0,0);$('#main').focus({preventScroll:true})}}
function finishVocabulary(){const s=state.vocabulary.session;s.finished=true;const score=vocabSessionScore(s);state.vocabulary.history=state.vocabulary.history.filter(h=>h.id!==s.id);state.vocabulary.history.push({id:s.id,date:Date.now(),words:s.words.length,...score});state.vocabulary.history=state.vocabulary.history.slice(-30);save();vocabScreen='session';if($('#dialog').open)closeDialog();paintVocabulary()}
function vocabSessionScore(s){const checks=Object.entries(s.responses).filter(([id,r])=>(id.startsWith('meaning-')||id.startsWith('recall-'))&&r.checked);return{correct:checks.filter(([id,r])=>r.correct&&!r.assisted).length,total:s.words.length*2,writing:s.words.filter(id=>s.responses['writing-'+id]?.done).length}}
function vocabResults(){const s=state.vocabulary.session,score=vocabSessionScore(s),retry=s.words.filter(id=>!wordPathComplete(id));return head('VOCABULARY / SESSION REVIEW','See which words stayed with you.','Meaning checks and unassisted recall are scored automatically. Original sentences use local self-review or imported ChatGPT feedback.')+`<div class="results-grid"><div class="result-hero"><span class="eyebrow">MEANING + UNASSISTED RECALL</span><div class="score">${score.correct}<span style="font-size:30px"> / ${score.total}</span></div><h2>${s.words.length} words practiced</h2><p>Unanswered, incorrect, and hinted checks are not counted as independent correct recall.</p></div><div class="card writing-result"><span class="eyebrow">ORIGINAL WRITING</span><h2>${score.writing} / ${s.words.length}</h2><p class="tiny muted">Sentences reviewed this session. Your drafts and review flags are saved word by word.</p><p class="tiny muted">${retry.length} selected words still have an incomplete practice path.</p></div></div><div class="button-row"><button class="btn" data-action="vocab-retry" ${!retry.length?'disabled':''}>Practice ${retry.length} unfinished words again →</button><button class="btn secondary" data-action="vocab-hub">See all word progress</button><button class="utility" data-action="vocab-export">↓ Export my work</button></div><div class="section-head"><h2>Word-by-word review</h2></div>${s.words.map(id=>{const v=VOCAB.find(v=>v.id===id),m=s.responses['meaning-'+id],r=s.responses['recall-'+id],w=state.vocabulary.records[id]?.writing;return`<article class="card space-top"><div class="sentence-row-top"><h3>${v.word}</h3><span class="learning-badge ${wordPathComplete(id)?'complete':'pending'}">${wordPathComplete(id)?'Path complete':'More practice needed'}</span></div><p>${v.def}</p><p class="tiny muted">Meaning: ${m?.checked?m.correct?'correct':'incorrect':'not checked'} · Recall: ${r?.checked?r.correct?r.assisted?'correct with hint':'correct without hint':'incorrect':'not checked'}</p>${r?.checked?`<p class="tiny">Your recall: ${esc(r.typed||'[blank]')} · Correct word: ${v.word}</p>`:''}<div class="response-copy">${esc(w?.text||'[No sentence written yet]')}</div><p class="tiny muted">Writing: ${w?.reviewed?'self-reviewed':'unfinished or awaiting self-review'}</p><p class="tip">${v.tip}</p></article>`}).join('')}`}
function requestVocabSession(words){const s=state.vocabulary.session;if(s&&!s.finished){window.pendingVocabWords=words;dialog('<h2>Replace the current vocabulary session?</h2><p>Your current round has unfinished steps. A new session replaces that queue; all word scores, writing drafts, and self-reviews are kept.</p><div class="button-row"><button class="btn secondary" data-action="close-dialog">Keep current session</button><button class="btn" data-action="vocab-confirm-start">Start new word set</button></div>')}else buildVocabSession(words)}
function handleVocabularyAction(a,v){if(!a.startsWith('vocab-'))return false;const s=state.vocabulary.session,t=s?.tasks[s.index],r=t?(s.responses[t.id]||=( {})):null,word=t?VOCAB.find(v=>v.id===t.ref):null;
 if(a==='vocab-start'){const count=Number($('#vocab-count').value),scope=$('#vocab-scope').value;state.vocabulary.preferences={count,scope};requestVocabSession(chooseVocabWords(count,scope))}
 else if(a==='vocab-confirm-start'){const words=window.pendingVocabWords;delete window.pendingVocabWords;closeDialog();if(words)buildVocabSession(words)}

 else if(a==='vocab-hub'){vocabScreen='hub';save();paintVocabulary()}
 else if(a==='vocab-resume'){vocabScreen='session';paintVocabulary()}
 else if(a==='vocab-export'){const text=['MARGIN VOCABULARY PROGRESS','',...VOCAB.flatMap(v=>{const r=state.vocabulary.records[v.id];return[v.word+' — '+v.def,'Learned: '+!!r?.learned+'; meaning check: '+(r?.meaning?r.meaning.correct?'correct':'incorrect':'not checked')+'; recall: '+(r?.recall?(r.recall.correct?'correct':'incorrect')+(r.recall.assisted?' with hint':' without hint'):'not checked'),'Your sentence: '+(r?.writing?.text||'[not written]'),'Writing self-review: '+!!r?.writing?.reviewed,'']})].join('\n');download('my-vocabulary-progress.txt',text,'text/plain;charset=utf-8');toast('Vocabulary scores and writing exported.')}
 else if(!s||s.finished){if(a==='vocab-retry'){const ids=s.words.filter(id=>!wordPathComplete(id));if(ids.length)buildVocabSession(ids)}return true}
 else if(a==='vocab-learn'){vocabRecord(word.id).learned=true;r.done=true;save();paintVocabulary(true)}

function aiReceiveTransfer(){if(!AI_LOCAL||!location.hash.startsWith('#receive='))return;const nonce=location.hash.slice(9),opener=window.opener;if(!opener||!/^[a-f0-9-]{36}$/.test(nonce))return;history.replaceState(null,'','#home');const expires=Date.now()+90000;const receive=event=>{if(Date.now()>expires||event.source!==opener||event.origin!=='null'||event.data?.type!=='margin-progress'||event.data.nonce!==nonce)return;window.removeEventListener('message',receive);let imported;try{imported=validateState(event.data.progress)}catch{toast('Could not read the transferred save. Use backup and restore.');return}dialog(`<h2>Bring your saved study work here?</h2><p>${imported.sentences.filter(s=>s.text.trim()).length} sentence drafts · ${imported.history.length} completed practice sessions · ${imported.vocabulary.history.length} vocabulary sessions.</p><p class="tiny muted">Your original HTML save is kept. A backup of this local version is downloaded before its data is replaced.</p><button class="btn" id="ai-confirm-transfer">Import saved work</button>`);$('#ai-confirm-transfer').addEventListener('click',()=>{download('margin-before-transfer-'+Date.now()+'.json',JSON.stringify(state,null,2),'application/json');state=imported;save(true);closeDialog();loadLatestProgress();toast('Study work imported. Sign in at the top right when ready.')},{once:true})};window.addEventListener('message',receive);opener.postMessage({type:'margin-ready',nonce},'*');setTimeout(()=>window.removeEventListener('message',receive),90000)}
function handleAIAction(a,v,el){if(!a.startsWith('ai-'))return false;if(a==='ai-account')aiShowAccount();else if(a==='ai-transfer')aiTransfer();else if(a==='ai-grade')aiGrade(el.dataset.kind,v);else if(a==='ai-recheck'){const g=aiGradeFor(el.dataset.kind,v);if(g){aiApply(el.dataset.kind,v,g);save();aiRepaint()}}else if(a==='ai-submit-exam'){submitExam();aiGradeExam()}else if(a==='ai-grade-exam')aiGradeExam();else if(a==='ai-stop-batch'){if(aiBatch){aiBatch.stop=true;el.disabled=true}}else if(a==='ai-refresh')aiRefreshConnection(true);else if(a==='ai-sign-in'||a==='ai-add-account'){aiRequest('sign-in',{newProfile:a==='ai-add-account',reconsent:aiConnection.session.status==='connected'&&!aiConnection.session.sharing}).then(()=>{aiConnection.signingIn=true;aiConnection.error='';$('#ai-account-content').outerHTML=aiAccountContent();clearInterval(aiPoll);aiPoll=setInterval(async()=>{await aiRefreshConnection(false);if(!aiConnection.signingIn){clearInterval(aiPoll);await aiRefreshConnection(true)}},1500)}).catch(error=>{aiConnection.error=error.message;$('#ai-account-content').outerHTML=aiAccountContent()})}else if(a==='ai-cancel')aiRequest('cancel-sign-in',{}).then(()=>aiRefreshConnection());else if(a==='ai-disconnect')aiRequest('disconnect',{}).then(()=>{aiConnection.models=[];return aiRefreshConnection()}).catch(error=>{aiConnection.error=error.message;aiRefreshConnection()});else if(a==='ai-stop')aiRequest('stop',{}).then(()=>{aiConnection.ready=false;aiConnection.error='The local companion is stopped. Your local review still works. Start Margin.command to reconnect.';aiUpdateAccountButton();$('#ai-account-content').outerHTML=aiAccountContent()});return true}
